# 직접 서버에 올릴 때 (사내 서버·VPS)
#
#   기본 — 사내망에서만 쓴다
#     STORE_SCOUT_REV=$(git rev-parse HEAD) docker compose up -d --build
#     docker compose exec app python3 -m server.bootstrap --org "조직명" --email you@brand.co.kr
#
#   밖에서도 접속 — Cloudflare Tunnel 을 함께 띄운다 (DEPLOY.md 참고)
#     cp .env.example .env      # CLOUDFLARE_TUNNEL_TOKEN 과 STORE_SCOUT_HTTPS=1 을 채운다
#     docker compose --profile tunnel up -d --build
#
# ⚠ 터널 없이 이 구성은 8000 포트로 **평문 HTTP** 를 연다(루프백에만 붙는다).
#   밖으로 낼 때는 반드시 HTTPS 를 끝내는 무언가를 앞에 두십시오 —
#   Cloudflare Tunnel·Caddy·nginx 중 하나. 로그인 쿠키와 고객 연락처가 흐르는 길입니다.
#   그리고 그때 STORE_SCOUT_HTTPS=1 을 켜야 세션 쿠키에 Secure 가 붙습니다.

services:
  app:
    build:
      context: .
      args:
        # 올리는 커밋이 곧 알고리즘 판이다. /healthz 가 이 값을 내보내야 어떤 판이
        # 그 판정을 냈는지 나중에 짚을 수 있다. 비워 두면 rev=unknown 이 된다.
        #   STORE_SCOUT_REV=$(git rev-parse HEAD) docker compose up -d --build
        STORE_SCOUT_REV: "${STORE_SCOUT_REV:-unknown}"
    restart: unless-stopped
    # 프록시 뒤에 두는 것이 전제다. 외부에 직접 노출하려면 이 줄을 "8000:8000" 으로
    # 바꾸기 전에 위의 경고를 먼저 읽으십시오.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STORE_SCOUT_DB: /data/store-scout.sqlite3
      STORE_SCOUT_TIMEOUT: "900"
      # 프록시가 HTTPS 를 끝내면 "1" 로 두십시오
      STORE_SCOUT_HTTPS: "${STORE_SCOUT_HTTPS:-}"
    volumes:
      - scout-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if b'pipeline=yes' in urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).read() else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s

  # 매일 03:30 에 백업 한 벌. 최근 14개만 남긴다.
  # 백업에는 기존점 실매출과 상담 개인정보가 들어 있다 — ./backup 을 서버와 같은
  # 수준으로 통제하거나, 암호화해 다른 곳으로 옮기십시오.
  backup:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # 시계 산술을 하지 않는다 — 컨테이너 시간대와 date 구현에 따라 조용히 어긋난다.
    # 올릴 때 한 벌 뜨고 그 뒤 24시간마다 한 벌.
    command: >
      'while true; do
         python3 scripts/backup.py /backup --keep 14 || echo "백업 실패";
         sleep 86400;
       done'
    environment:
      STORE_SCOUT_DB: /data/store-scout.sqlite3
    volumes:
      - scout-data:/data
      - ./backup:/backup

  # ── 밖에서 접속하게 할 때만 (profile: tunnel) ───────────────────────
  # Cloudflare Tunnel. 공유기·방화벽에 **포트를 하나도 열지 않고** HTTPS 주소를
  # 만든다. 나가는 연결만 쓰기 때문이다. 무료이고, 개인정보는 여전히 이 서버에만
  # 남는다 — Cloudflare 는 TLS 를 끝내고 지나보낼 뿐 저장하지 않는다.
  #
  # 대시보드(Zero Trust → Networks → Tunnels)에서 터널을 만들고 토큰을 받아
  # .env 의 CLOUDFLARE_TUNNEL_TOKEN 에 넣는다. 공개 호스트명의 서비스는
  # http://app:8000 으로 지정한다(이 컴포즈 네트워크 안의 이름이다).
  #
  # ⚠ 터널을 켜면 이 화면이 인터넷에서 닿는다. 앱 자체 로그인이 있지만, 고객
  #   개인정보를 담은 사내 도구다 — Zero Trust → Access 로 한 겹 더 막는 것을
  #   권한다(50명까지 무료). DEPLOY.md 참고.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # ⚠ :? (필수) 를 쓰면 안 된다. 컴포즈는 **프로필과 무관하게** 모든 변수를 먼저
      #   풀기 때문에, 터널을 쓰지 않는 사람의 `docker compose up` 까지 막힌다.
      #   비어 있으면 cloudflared 가 자기 말로 거절한다.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      app:
        condition: service_healthy

volumes:
  scout-data:
