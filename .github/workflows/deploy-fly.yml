name: Fly 배포

# 손으로 눌러서만 배포한다. push 마다 자동으로 올리지 않는 이유가 있다:
# 배포는 프로세스를 갈아 끼우고, 그때 돌던 심의는 함께 죽는다(재시작 때 '실패'로
# 정리되지만 사용자는 다시 올려야 한다). 언제 끊을지는 사람이 정해야 한다.
#
# 처음 한 번만 준비하면 된다:
#   0. fly.io → Account → Billing 에 결제 수단을 등록한다.
#      없으면 토큰이 있어도 배포가 되지 않는다 ("To start deploying apps you'll
#      need to add a payment method"). 이 구성은 기계 하나를 24시간 띄워 두므로
#      무료 구간에 기대지 않는다 — DEPLOY.md 의 「시작 전에」 참고.
#   1. 토큰 발급
#      개인 토큰:  https://fly.io/user/personal_access_tokens
#      ⚠ 조직이 SSO 를 강제하면 개인 토큰이 만들어지지 않는다. 그때는 조직 토큰:
#          flyctl orgs list                  # 조직 이름 확인
#          flyctl tokens org <조직명>         # 앱·볼륨을 만들 수 있는 토큰
#      앱 하나로 좁힌 배포 토큰도 쓸 수 있지만, 그 토큰은 앱을 만들지 못하므로
#      앱과 볼륨을 먼저 손으로 만들어야 한다:
#          flyctl tokens create deploy -a store-scout
#   2. 저장소 Settings → Secrets and variables → Actions → New repository secret
#      이름 FLY_API_TOKEN
#   3. Actions 탭에서 이 워크플로를 Run workflow
#      (앱과 볼륨은 없으면 아래 '앱·볼륨 준비' 단계가 만든다 — 있으면 건드리지 않는다)
#
# 배포 뒤 첫 조직·관리자는 한 번 만들어야 한다:
#   fly ssh console -C "python3 -m server.bootstrap --org '조직명' --email you@brand.co.kr"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "검사만 하고 배포하지 않는다"
        required: false
        type: boolean
        default: false

concurrency:
  # 배포가 겹치면 기계 하나를 두 배포가 동시에 갈아 끼운다
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 배포 전에 테스트를 돌린다. 조직 격리·권한·개인정보 방지선이 깨진 채로
      # 올라가면 화면은 멀쩡해 보이고 사고만 난다.
      - name: 테스트
        run: |
          pip install -r requirements-dev.txt
          python3 -m unittest discover -s tests -v

      - name: 배포 전 점검
        run: python3 scripts/preflight.py

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 앱·볼륨 준비
        if: ${{ !inputs.dry_run }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || {
            echo "::error::FLY_API_TOKEN 시크릿이 없습니다. 이 파일 맨 위의 준비 절차를 보십시오."
            exit 1
          }
          APP=$(python3 -c "import tomllib;print(tomllib.load(open('fly.toml','rb'))['app'])")
          REGION=$(python3 -c "import tomllib;print(tomllib.load(open('fly.toml','rb'))['primary_region'])")
          VOL=$(python3 -c "import tomllib;print(tomllib.load(open('fly.toml','rb'))['mounts']['source'])")

          # 토큰 종류를 가린다. flyctl apps list 는 **조직 토큰**에서만 되고,
          # 앱 하나로 좁힌 배포 토큰(flyctl tokens create deploy -a APP)에서는
          # 권한이 모자라 실패한다. 그 실패를 '앱이 없다' 로 읽으면 이미 있는 앱을
          # 다시 만들려다 죽는다. 그래서 앱 자체를 직접 물어본다 — 두 토큰 다 된다.
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "앱 $APP 있음"
          else
            echo "앱 $APP 이 없어 만든다 (조직 토큰이어야 한다)"
            flyctl apps create "$APP" || {
              echo "::error::앱을 만들지 못했습니다. 배포 토큰은 앱을 만들 수 없습니다 —"
              echo "::error::조직 토큰을 쓰거나(flyctl tokens org <조직명>), 앱과 볼륨을 먼저 만드십시오:"
              echo "::error::  flyctl apps create $APP"
              echo "::error::  flyctl volumes create $VOL --size 1 --region $REGION --app $APP"
              exit 1
            }
          fi

          # ⚠ 볼륨이 이미 있으면 **절대** 새로 만들지 않는다. 두 개가 되면 기계가
          #   어느 쪽을 붙일지 알 수 없고, 붙지 않은 쪽의 조직 데이터가 통째로
          #   사라진 것처럼 보인다. 화면은 멀쩡하고 DB 만 비어 있다.
          if flyctl volumes list --app "$APP" | grep -qw "$VOL"; then
            echo "볼륨 $VOL 이미 있음 — 건드리지 않는다"
          else
            flyctl volumes create "$VOL" --size 1 --region "$REGION" --app "$APP" --yes
          fi

      - name: 배포
        if: ${{ !inputs.dry_run }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || {
            echo "::error::FLY_API_TOKEN 시크릿이 없습니다. 이 파일 맨 위의 준비 절차를 보십시오."
            exit 1
          }
          # 알고리즘이 이 저장소에 있으므로 배포하는 커밋이 곧 알고리즘 판이다.
          # /healthz 가 이 값을 내보내야 어떤 판이 그 판정을 냈는지 짚을 수 있다.
          flyctl deploy --remote-only --build-arg STORE_SCOUT_REV="$GITHUB_SHA"

      - name: 배포 확인
        if: ${{ !inputs.dry_run }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(python3 -c "import tomllib;print(tomllib.load(open('fly.toml','rb'))['app'])")
          # 어느 알고리즘 판이 올라갔는지 배포 기록에 남긴다
          for i in 1 2 3 4 5 6; do
            OUT=$(curl -fsS "https://$APP.fly.dev/healthz" 2>/dev/null) && break
            echo "  대기 중... ($i/6)"; sleep 10
          done
          echo "$OUT"
          case "$OUT" in
            *"pipeline=yes"*) ;;
            *) echo "::error::알고리즘이 이미지에 없습니다. 이대로면 모든 심의가 실패합니다."; exit 1 ;;
          esac
          case "$OUT" in
            *"rev=$GITHUB_SHA"*) ;;
            *) echo "::error::올라간 판이 이 커밋이 아닙니다: $OUT"; exit 1 ;;
          esac
          echo "### 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://$APP.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "$OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
