name: 스스닷컴 공개 페이지

# store-scout.com 으로 나갈 공개 페이지를 GitHub Pages 로 배포한다.
# 서비스 소개 · 후보지 데이터 입력 · 고객 상담 세 화면이다.
#
# 배포하지 않는 것
#   analysis/     파이프라인 소스. 웹에서 쓸 것이 아니다.
#   app/          심의 콘솔 — 사내 한정 · 대외 배포 금지.
#   docs/         알고리즘 내부 설명. 백엔드 문서다.
#   server/       SaaS. 이건 컨테이너로 따로 뜬다.
#
# 활성화: Settings → Pages → Source = "GitHub Actions"
# 도메인: Settings → Pages → Custom domain 에 store-scout.com 을 넣으면
#         Actions 가 CNAME 을 관리한다. DNS 를 먼저 걸어 두어야 한다.

on:
  push:
    branches: [main]
    paths:
      - "cafe-trade-area/index.html"
      - "cafe-trade-area/input/**"
      - "cafe-trade-area/consult/**"
      - "cafe-trade-area/shared/**"
      - ".github/pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        # 사이트 구조 (store-scout.com 기준)
        #   /            스스닷컴 서비스 소개
        #   /input/      후보지 데이터 입력
        #   /consult/    고객 상담 — 서버 없음, 개인정보는 브라우저 밖으로 안 나간다
        #   /app/        안내 페이지만. 심의 콘솔은 올리지 않는다.
        run: |
          mkdir -p _site/app
          cp cafe-trade-area/index.html _site/index.html
          cp -r cafe-trade-area/input _site/input
          cp -r cafe-trade-area/consult _site/consult
          # 두 화면이 함께 쓰는 스타일. 빠지면 양쪽 다 스타일 없이 뜬다
          cp -r cafe-trade-area/shared _site/shared
          # 소개 페이지가 app/ 를 링크한다. 파일만 빼면 깨진 링크가 남으므로
          # 같은 자리에 안내 페이지를 두어 링크는 살리고 콘솔은 올리지 않는다.
          cp .github/pages/심의콘솔-안내.html _site/app/index.html

          # ── 여기부터 가드. 하나라도 걸리면 배포하지 않는다. ──
          test -s _site/index.html          || { echo "소개 페이지가 없습니다"; exit 1; }
          test -s _site/input/index.html    || { echo "데이터 입력 페이지가 없습니다"; exit 1; }
          test -s _site/consult/index.html  || { echo "상담 페이지가 없습니다"; exit 1; }
          test -s _site/shared/base.css     || { echo "공통 스타일이 없습니다"; exit 1; }

          # 상담 페이지는 개인정보를 다룬다 — 어떤 형태로든 외부 전송 코드가 섞이면 중단
          if grep -rqE 'fetch\(|XMLHttpRequest|sendBeacon|WebSocket' _site/consult/; then
            echo "상담 페이지에 외부 전송 코드가 있습니다"; exit 1
          fi
          # 심의 콘솔 자산이 섞였는지 — 사내 한정이다
          if [ -e _site/app/js ] || [ -e _site/app/styles.css ]; then
            echo "심의 콘솔 자산이 배포 산출물에 있습니다"; exit 1
          fi
          # 알고리즘 문서는 백엔드 문서다
          if find _site -name '알고리즘.html' | grep -q .; then
            echo "알고리즘 문서가 배포 산출물에 있습니다"; exit 1
          fi
          # 서버 코드가 섞였는지 — 정적 사이트에 있을 이유가 없다
          if find _site -name '*.py' | grep -q .; then
            echo "파이썬 파일이 배포 산출물에 있습니다"; exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
