name: 스스닷컴 공개 페이지

# stores-scout.com 으로 나갈 공개 페이지를 GitHub Pages 로 배포한다.
# 프론트엔드는 web/ 하나뿐이다 — React + Vite 정적 빌드.
#
# 배포하지 않는 것 (전부 백엔드다)
#   cafe-trade-area/analysis/   파이프라인 · 계수 · 판정 로직
#   cafe-trade-area/app/        심의 콘솔 — 사내 한정 · 대외 배포 금지
#   cafe-trade-area/docs/       알고리즘 내부 설명
#   server/                     SaaS. 컨테이너로 따로 뜬다
#
# 활성화: Settings → Pages → Source = "GitHub Actions"
#
# 도메인: web/public/CNAME 이 스위치다.
#   없다  → https://<user>.github.io/store-scout/  (base = /store-scout/)
#   있다  → https://stores-scout.com/               (base = /)
# GitHub 는 Actions 배포에서 CNAME 파일을 읽지 않는다 — 도메인은 Settings → Pages
# 에서 붙인다. 이 파일은 우리 쪽 스위치일 뿐이다. 순서와 절차는 DEPLOY.md 의
# 「공개 페이지 도메인」 절에 있다. 순서를 어기면 몇 분 동안 사이트가 깨진다.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true 를 쓰지 않는다. Actions 기본 토큰에는 Pages 를 새로 만들 권한이
      # 없어서, 아직 안 켜져 있으면 'Resource not accessible by integration' 으로 죽는다.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # base 를 CNAME 유무로 정한다. 사람이 두 자리(도메인 설정·base)를 따로 고치면
      # 한쪽만 바뀐 채 배포되고, 그러면 모든 자산이 404 라 흰 화면이 뜬다 — 오류 없이.
      - name: Decide base
        id: base
        run: |
          if [ -s web/public/CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < web/public/CNAME)"
            if [ "$DOMAIN" != "stores-scout.com" ]; then
              echo "::error::web/public/CNAME 이 stores-scout.com 이 아닙니다: '$DOMAIN'"
              exit 1
            fi
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "도메인 배포 — base=/ ($DOMAIN)"
          else
            echo "base=/store-scout/" >> "$GITHUB_OUTPUT"
            echo "저장소 Pages 배포 — base=/store-scout/"
          fi

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Map loader tests
        working-directory: web
        run: npm run test:map && npm run test:phone

      - name: Validate Kakao Maps JavaScript key
        env:
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.KAKAO_MAP_JS_KEY }}
        run: |
          if [ -z "$VITE_KAKAO_MAP_JS_KEY" ]; then
            echo "::error::Repository secret KAKAO_MAP_JS_KEY가 없거나 비어 있습니다"
            exit 1
          fi
          if [ "${#VITE_KAKAO_MAP_JS_KEY}" -lt 20 ]; then
            echo "::error::KAKAO_MAP_JS_KEY가 올바른 JavaScript 키 형식이 아닙니다"
            exit 1
          fi
          echo "카카오맵 JavaScript 키 확인 완료 (값은 출력하지 않음)"

      - name: Build
        # JavaScript SDK 키만 전달. 서버 비밀키는 VITE_ 변수에 넣지 않습니다.
        working-directory: web
        env:
          STORE_SCOUT_BASE: ${{ steps.base.outputs.base }}
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.KAKAO_MAP_JS_KEY }}
        run: npm run build

      - name: Verify Kakao Maps key injection
        working-directory: web
        env:
          VITE_KAKAO_MAP_JS_KEY: ${{ secrets.KAKAO_MAP_JS_KEY }}
        run: |
          if ! grep -rqlF -- "$VITE_KAKAO_MAP_JS_KEY" dist/assets/; then
            echo "::error::Vite 빌드 산출물에 KAKAO_MAP_JS_KEY가 주입되지 않았습니다"
            exit 1
          fi
          echo "카카오맵 키 빌드 주입 확인 완료 (값은 출력하지 않음)"

      - name: Assemble site
        run: |
          mv web/dist _site
          test -s _site/index.html               || { echo "메인 페이지가 없습니다"; exit 1; }
          test -s _site/consultation/index.html  || { echo "상담 페이지가 없습니다"; exit 1; }

          # 빌드된 HTML 이 정한 base 로 자산을 가리키는지 본다. 어긋나면 흰 화면이다.
          BASE='${{ steps.base.outputs.base }}'
          if ! grep -q "src=\"${BASE}assets/" _site/index.html; then
            echo "::error::index.html 의 자산 경로가 base(${BASE}) 와 다릅니다"
            grep -o 'src="[^"]*"' _site/index.html | head
            exit 1
          fi
          if [ "$BASE" = "/" ]; then
            test -s _site/CNAME || { echo "::error::CNAME 이 산출물에 없습니다"; exit 1; }
          fi

          # Vite가 키를 빌드에 실제 주입했는지 값 노출 없이 확인한다.
          if ! grep -rq 'dapi.kakao.com/v2/maps/sdk.js' _site/assets/; then
            echo "::error::빌드 산출물에 카카오맵 JavaScript SDK 로더가 없습니다"
            exit 1
          fi

          # ── 여기부터 가드. 하나라도 걸리면 배포하지 않는다. ──────────────
          # 공개 프론트에 백엔드 값이 섞이면 회사 원가 모델이 그대로 나간다.
          # 실제로 옛 정적 화면이 그 상태였다 — 오류가 아니라서 아무도 몰랐다.
          # 값(980·0.412…)만 막으면 이름을 바꿔 빠져나가므로 이름으로 막는다.
          # 변수 이름은 ASCII 여야 한다 — bash 는 한글 변수명을 받지 않는다.
          BACKEND_WORDS='고정인건비|대출비율|연금리|리스_월|변동비율|좌석수_기본|흡인력|잔존율|등시선|m5_verdict|quick_site|설정\.yaml'
          if grep -rqE "$BACKEND_WORDS" _site/; then
            echo "::error::백엔드 값·이름이 공개 산출물에 있습니다"
            grep -rhoE "$BACKEND_WORDS" _site/ | sort -u | head -20
            exit 1
          fi

          # 백엔드 파일이 정적 산출물에 섞이면 안 된다
          if find _site \( -name '*.py' -o -name '*.yaml' -o -name '*.yml' \) | grep -q .; then
            echo "::error::백엔드 파일이 공개 산출물에 있습니다"
            find _site \( -name '*.py' -o -name '*.yaml' -o -name '*.yml' \)
            exit 1
          fi

          # 상담 화면은 개인정보를 다룬다 — 서버로 보내는 코드가 있으면 중단.
          # 카카오 우편번호 스크립트(주소 검색)는 <script src> 라 여기 걸리지 않는다.
          if grep -rq "XMLHttpRequest\|sendBeacon\|new WebSocket" _site/assets/; then
            echo "::error::상담 화면에 외부 전송 코드가 있습니다"
            exit 1
          fi

          echo "가드 통과 — 공개 산출물에 백엔드 내용 없음"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
