# 점포개발 심의 알고리즘 v1.0 — 브랜드/운영 설정
# 계수(λ·횡단저항·κ 등)는 여기가 아니라 config.py 의 계수 레지스트리에 있습니다.
# 그쪽은 검증 상태(MEASURED/ESTIMATED)까지 함께 관리되며 M6 가 교정합니다.

브랜드: 카페하다
자사브랜드티어: 동일가격대     # M3 흡인력 A 의 브랜드가중
좌석수_기본: 24                # 후보지에 좌석수가 없을 때
영업일수: 30
보행네트워크: false            # true 면 d 를 네트워크 거리로 본다(현재는 직선×우회계수)

운영:
  # v = 원재료율 + 로열티율 + 광고분담금율  (명세 M5)
  변동비:
    원재료율: 0.35
    로열티율: 0.03
    광고분담금율: 0.01
    기타변동비율: 0.022        # 카드수수료 등 — 명세 원식에 없어 별도 항목으로 둡니다
  # F = 임대료 + 관리비 + 고정인건비 + 기타  (임대료·관리비는 후보지 CSV 에서)
  고정비:
    고정인건비_월_만원: 620
    기타_월_만원: 170          # 수도광열·소모품·기타

# 상담에서 고른 운영 형태가 고정인건비를 바꿉니다 (M5 의 F → BEP → margin).
# 금액은 브랜드·지역·근무시간에 따라 달라지므로 **여기서 회사 실정에 맞게 고치십시오.**
# 아래는 24시간이 아닌 통상 영업(12시간) 기준의 자리표시자입니다.
운영형태:
  오토:
    고정인건비_월_만원: 980
    설명: 점주 미근무 — 전 시간대를 고용으로 채운다
  점주+알바:
    고정인건비_월_만원: 620
    설명: 점주가 주간을 맡고 나머지를 알바로 채운다 (기본값)
  점주:
    고정인건비_월_만원: 260
    설명: 점주 단독 — 피크 시간만 알바

# 투자금 형태가 월 금융비용을 만들고, 그것이 고정비 '기타' 에 더해집니다.
# 대출 원금은 상담 단계에서 알 수 없으므로 (보증금 + 권리금) × 대출비율 로 잡습니다 —
# 시설자금·운전자금이 빠진 **과소 추정**입니다. 실제 대출 조건이 나오면 고치십시오.
투자금형태:
  현금:
    대출비율: 0.0
    연금리: 0.0
    리스_월_만원: 0
    설명: 차입 없음 — 월 금융비용 0
  현금+대출:
    대출비율: 0.5
    연금리: 0.06
    리스_월_만원: 0
    설명: 투자금의 절반을 차입한다고 가정
  현금+대출+리스:
    대출비율: 0.5
    연금리: 0.06
    리스_월_만원: 45
    설명: 차입에 더해 기기 리스료가 매월 붙는다

# 상담 단계에서 후보지를 거르는 기준입니다. 알고리즘이 아니라 **필터**입니다 —
# 여기서 걸러진 물건은 아예 심의에 올라오지 않습니다.
상담필터:
  평수_허용오차: 0.3          # 희망 평수 ±30% 까지 본다
  투자금_초과허용: 0.1        # 보증금+권리금이 희망액의 110% 까지는 후보로 둔다

# 대외 배포 통제 — 리포트 머리말에 그대로 인쇄됩니다
거버넌스:
  문서등급: 사내 한정 · 대외 배포 금지
  고지: >
    본 산출물은 내부 의사결정 자료입니다. 가맹희망자에게 제공하는 예상매출액
    산정서와 수치를 혼용하지 마십시오. 제공치가 내부 중앙값 추정치를 초과하지
    않도록 별도 통제해야 합니다.
