<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>심의 콘솔 · 점포개발</title>
<meta name="description" content="점포개발 심의 알고리즘 v1.0 의 산출물을 읽는 사내 콘솔. 판정·근거·미검증 계수를 한 화면에서 확인하고, M5 판정 산술을 협상 가정으로 다시 계산합니다."/>
<meta name="robots" content="noindex"/>
<meta name="color-scheme" content="light"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efeae0'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%239a3b1b' stroke-width='1.4' stroke-dasharray='3 3'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%239a3b1b'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-in">
      <a class="logo" href="../index.html"><span class="mark">◎</span>심의 콘솔<small>점포개발 · 사내 한정</small></a>
      <div class="top-actions">
        <button class="sm ghost" id="btn-demo">예시 결과</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="status" aria-selected="true">심의 현황</button>
      <button class="tab" role="tab" data-tab="sites" aria-selected="false">후보지<span class="pill" id="pill-sites">0</span><span class="pill edit hide" id="pill-inputs">0</span></button>
      <button class="tab" role="tab" data-tab="sim" aria-selected="false">손익 시뮬</button>
      <button class="tab" role="tab" data-tab="coef" aria-selected="false">계수 입력<span class="pill" id="pill-coef">0</span></button>
      <button class="tab" role="tab" data-tab="data" aria-selected="false">데이터</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="p-status" class="panel"></section>
  <section id="p-sites" class="panel hide"></section>
  <section id="p-sim" class="panel hide"></section>
  <section id="p-coef" class="panel hide"></section>
  <section id="p-data" class="panel hide"></section>
</main>

<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/inputs.js"></script>
<script src="js/m5.js"></script>
<script src="js/demo.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
